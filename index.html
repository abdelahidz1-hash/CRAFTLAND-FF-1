<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTLAND FF</title>
    <!-- استيراد خط Cairo من Google Fonts بوزن 250 ووزون إضافية عند الحاجة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@250;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 250;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* حاوية التطبيق الرئيسية */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }

        /* عنوان التطبيق العلوي */
        .app-title {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* شريط البحث */
        .search-box {
            width: 100%;
            padding: 14px 18px;
            background-color: #0b0b0b;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 250;
            font-size: 1rem;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            border-color: #ff5500;
        }

        .search-box::placeholder {
            color: #888;
        }

        /* بطاقة العنصر (Card) مع إطار متحرك ومتغير الألوان */
        .item-card {
            width: 100%;
            background-color: #080808;
            border: 2px solid #ff5500;
            border-radius: 18px;
            padding: 30px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            animation: borderGlowAnimation 6s infinite;
        }

        @keyframes borderGlowAnimation {
            0% {
                border-color: #ff5500;
                box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
            }
            25% {
                border-color: #ffd700; /* ذهبي */
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            }
            50% {
                border-color: #e0e0e0; /* فضي */
                box-shadow: 0 0 15px rgba(224, 224, 224, 0.3);
            }
            75% {
                border-color: #ffffff; /* أبيض مضيء */
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            100% {
                border-color: #ff5500;
                box-shadow: 0 0 15px rgba(255, 85, 0, 0.3);
            }
        }

        /* حاوية الصورة */
        .item-image-container {
            width: 100%;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .item-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* اسم العنصر مع تأثير تغير الألوان */
        .item-name {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
            animation: colorAnimation 5s infinite;
        }

        @keyframes colorAnimation {
            0% {
                color: #ffffff;
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            }
            33% {
                color: #e0e0e0;
                text-shadow: 0 0 8px rgba(224, 224, 224, 0.8), 0 0 20px rgba(180, 180, 180, 0.5);
            }
            66% {
                color: #ffd700;
                text-shadow: 0 0 8px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            }
            100% {
                color: #ffffff;
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            }
        }

        /* وصف العنصر */
        .item-desc {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 250;
        }

        /* زر النسخ */
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .copy-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .copy-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- العنوان العلوي -->
        <h1 class="app-title">CRAFTLAND FF</h1>

        <!-- شريط البحث -->
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم الخريطة...">

        <!-- حاوية البطاقات -->
        <div id="cardsContainer" style="width: 100%;"></div>
    </div>

    <script>
        let allItems = [];

        // جلب البيانات من ملف items.json الخارجي
        fetch('items.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('فشل في جلب ملف البيانات');
                }
                return response.json();
            })
            .then(data => {
                allItems = data;
                displayItems(allItems);
            })
            .catch(error => {
                console.error('خطأ:', error);
                document.getElementById('cardsContainer').innerHTML = '<p style="text-align: center; color: #ff5500; margin-top: 20px; font-weight: 250;">تعذر تحميل البيانات من الملف الخارجي</p>';
            });

        function displayItems(items) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777; margin-top: 20px; font-weight: 250;">لا توجد نتائج مطابقة</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                card.innerHTML = `
                    <div class="item-image-container">
                        <img src="${item.صورة}" alt="${item.اسم}">
                    </div>
                    <h2 class="item-name">${item.اسم}</h2>
                    <p class="item-desc">${item.وصف}</p>
                    <button class="copy-btn" onclick="copyCode('${item.شفرة}', this)" aria-label="نسخ">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // وظيفة نسخ الشفرة
        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const originalSvg = btn.innerHTML;
                btn.innerHTML = '<span style="color:#ffd700; font-size:0.8rem; font-weight:bold;">تم النسخ</span>';
                setTimeout(() => {
                    btn.innerHTML = originalSvg;
                }, 1500);
            });
        }

        // البحث الحي
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchText = e.target.value.toLowerCase();
            const filtered = allItems.filter(item => 
                item.اسم.toLowerCase().includes(searchText) || 
                item.وصف.toLowerCase().includes(searchText)
            );
            displayItems(filtered);
        });
    </script>

</body>
</html>
