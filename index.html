<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFTLAND FF</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@250;300;700&display=swap" rel="stylesheet">

    <style>
        :root { --card-bg: #0a0a0a; --text-color: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; font-weight: 300; }
        body { background: #000000; color: var(--text-color); padding-bottom: 60px; }
        header { display: flex; justify-content: center; align-items: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); z-index: 100; }
        header h1 { font-size: 1rem; letter-spacing: 1px; color: #fff; font-weight: bold; }
        .controls { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        #search-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 10px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .app-card { background: #0a0a0a; border: 2px solid transparent; border-radius: 15px; background-clip: padding-box, border-box; background-origin: padding-box, border-box; background-image: linear-gradient(#0a0a0a, #0a0a0a), linear-gradient(45deg, #ff0000, #ff4500, #ff8c00); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.2s; box-shadow: 0 0 10px rgba(255, 69, 0, 0.2); }
        .app-icon { width: 150px; height: 150px; background: #0a0a0a; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        .card-custom-img { width: 100%; height: 160px; border-radius: 10px; object-fit: cover; margin-bottom: 15px; border: 1px solid #333; }
        .app-details h3 { font-size: 1.1rem; margin-bottom: 5px; color: #ff4500; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .app-description { font-size: 0.85rem; color: #ccc; margin-bottom: 15px; }
        .cod-container { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 5px 0 15px 0; color: #ffffff; font-weight: bold; font-size: 0.9rem; background: #000; padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .copy-btn { width: 24px; height: 24px; cursor: pointer; filter: invert(1); }
        .update-notice { text-align: center; font-size: 1.1rem; margin-top: 30px; color: #fff; text-shadow: 0 0 10px #ff4500; }
    </style>
</head>
<body>

    <header><h1>CRAFTLAND FF</h1></header>

    <div class="controls">
        <input type="text" id="search-input" placeholder="ابحث عن اسم الخريطة أو التصميم..." onkeyup="filterContent()">
    </div>

    <div class="container">
        <div class="apps-grid" id="apps-container"></div>
        <p class="update-notice">سوف يتم تحديث خرائط كرافتلاند تلقائيا</p>
    </div>

    <script>
        let allItems = [];

        // محاولة جلب البيانات من ملف items.json
        fetch('items.json')
            .then(response => {
                if (!response.ok) throw new Error('الملف غير موجود');
                return response.json();
            })
            .then(data => {
                allItems = data;
                renderItems(allItems);
            })
            .catch(error => {
                console.log('خطأ في جلب الملف، سيتم استخدام بيانات افتراضية:', error);
                // بيانات افتراضية في حال لم يتم العثور على items.json أو كان فارغاً لتظهر لك النتيجة فوراً
                allItems = [
                    {
                        name: "خريطة كرافتلاند تجريبية",
                        icon: "https://i.ibb.co/MDrvqgCc/Picsart-26-05-28-22-03-09-928.png",
                        description: "هذه خريطة تجريبية للتأكد من ظهور العناصر",
                        image: "https://i.ibb.co/1G2VgrDJ/1785410431071.png",
                        code: "99887766"
                    }
                ];
                renderItems(allItems);
            });

        function renderItems(items) {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';
            
            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color: #ff4500; text-align: center; grid-column: 1/-1;">لا توجد عناصر لعرضها حالياً</p>';
                return;
            }

            items.forEach((app, index) => {
                container.innerHTML += `
                <div class="app-card" id="card-${index}">
                    <div class="app-icon"><img src="${app.icon || ''}" alt=""></div>
                    <div class="app-details">
                        <h3>${app.name || 'بدون اسم'}</h3>
                        <p class="app-description">${app.description || ''}</p>
                    </div>
                    ${app.image ? `<img src="${app.image}" class="card-custom-img" alt="صورة العنصر">` : ''}
                    ${app.code ? `
                    <div class="cod-container">
                        <span>COD : ${app.code}</span>
                        <img src="https://images.icon-icons.com/935/PNG/96/copy-two-paper-sheets-interface-symbol_icon-icons.com_73283.png" class="copy-btn" onclick="copyToClipboard('${app.code}')">
                    </div>` : ''}
                </div>`;
            });
        }

        function filterContent() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filtered = allItems.filter(item => item.name && item.name.toLowerCase().includes(searchTerm));
            renderItems(filtered);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => alert("تم نسخ الكود: " + text));
        }
    </script>
</body>
</html>
